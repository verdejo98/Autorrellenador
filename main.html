<html>
	<head>
		<meta charset="UTF-8">
		<style>
			:root {
				--fondo: #e4e8e1;
				--card: #f7f8f4;
				--borde: #cfd6cb;
				--texto: #2f352e;
				--gris: #6b726b;
				--acento: #7a9b82;
				--acento-hover: #6b8a72;
			}
			* {
				box-sizing: border-box;
			}
			body {
				width: 300px;
				margin: 0;
				padding: 16px;
				background: var(--fondo);
				color: var(--texto);
				font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
				font-size: 14px;
			}
			.card {
				background: var(--card);
				border: 1px solid var(--borde);
				border-radius: 14px;
				padding: 18px;
				box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
			}
			h1 {
				font-size: 17px;
				font-weight: 600;
				margin: 0 0 2px;
			}
			p.sub {
				font-size: 12px;
				color: var(--gris);
				margin: 0 0 14px;
			}
			label {
				display: block;
				font-size: 12px;
				font-weight: 600;
				margin-bottom: 6px;
			}
			input[type="text"] {
				width: 100%;
				padding: 9px 10px;
				border: 1px solid var(--borde);
				border-radius: 8px;
				font-size: 13px;
				background: #fff;
				color: var(--texto);
			}
			input[type="text"]:focus {
				outline: none;
				border-color: var(--acento);
				box-shadow: 0 0 0 3px rgba(122, 155, 130, 0.18);
			}
			button {
				width: 100%;
				margin-top: 14px;
				padding: 10px;
				border: none;
				border-radius: 8px;
				background: var(--acento);
				color: #fff;
				font-size: 14px;
				font-weight: 600;
				cursor: pointer;
			}
			button:hover {
				background: var(--acento-hover);
			}
			button:active {
				transform: scale(0.98);
			}
		</style>
	</head>
	<body>
		<div class="card">
			<h1>Autorellenador</h1>
			<p class="sub">Formulario de transacciones</p>
			<form id="Datos">
				<label for="Caso">Número de caso:</label>
				<input type="text" id="Caso" name="Caso">
				<button type="submit">Rellenar</button>
			</form>
			<form id="Correo">
				<input type="text" id="NCaso" name="NCaso">
				<button type="submit">Enviar correo</button>
			</form>
		</div>
		<script src="popup.js"></script>
	</body>
</html>
